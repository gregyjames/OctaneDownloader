name: NuGet Publish

on:
  push:
    tags:
      - 'v*.*.*' # Specify the tag pattern, e.g., 'v1.0.0'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: | 
          10.x
    - uses: actions/cache@v6
      id: cacheStep
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Set VERSION variable from tag
      run: |
        $VERSION=$Env:GITHUB_REF_NAME.TrimStart("v")
        echo "VERSION=$VERSION" >> $Env:GITHUB_ENV
    - name: Restore dependencies
      run: dotnet restore
    - name: Decode SNK and save
      shell: powershell
      run: |
        [IO.File]::WriteAllBytes("signing-key.snk", [Convert]::FromBase64String("${{ secrets.SIGNING_KEY_BASE64 }}"))    
    - name: Build
      run: dotnet build src/OctaneEngine/OctaneEngine.csproj --no-restore --configuration Release /p:Version=$Env:VERSION /p:AssemblyVersion=$Env:VERSION
      env:
        SIGN_ASSEMBLY: true
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: gjames
    - name: Publish NuGet package
      run: dotnet nuget push artifacts/**/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
    - name: Delete SNK after build
      run: Remove-Item signing-key.snk
      shell: powershell
